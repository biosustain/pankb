{% extends "components/panel_iframe_universal.html" %}
{% block panel_header %}
<div class="dropdown">
    <!-- The button styles from Bootstrap:
    https://getbootstrap.com/docs/5.3/components/buttons/ -->
    <button class="btn btn-outline-dark btn-sm dropdown-toggle" type="button" id="dropdownButton" data-bs-toggle="dropdown" aria-expanded="false">
        Gene Class
    </button>
    <ul class="dropdown-menu" aria-labelledby="heatmapDropdown">
        <li><a class="dropdown-item" href="#" onclick="updateMatrix('core', 'Core'); return false;">Core</a></li>
        <li><a class="dropdown-item" href="#" onclick="updateMatrix('accessory', 'Accessory (default)'); return false;">Accessory (default)</a></li>
        <li><a class="dropdown-item" href="#" onclick="updateMatrix('1_15', 'Rare: Occurs 1% - 15% of strains'); return false;">Rare: Occurs 1% - 15% of strains</a></li>
        <li><a class="dropdown-item" href="#" onclick="updateMatrix('above_1', 'Rare: Occurs < 1% of strains, but > 2 strains'); return false;">Rare: Occurs < 1% of strains, but > 2 strains</a></li>
        <li><a class="dropdown-item" href="#" onclick="updateMatrix('only_1', 'Rare: Unique genes'); return false;">Rare: Unique genes</a></li>
    </ul>
    <form name="downloadMatrixForm" action="{% url 'download_matrix_csv' %}" method="GET" style="display: inline">
        <input type="hidden" name="species" id="form_species" value="{{ request.GET.species }}" />
        <input type="hidden" name="gene_class" id="form_gene_class" value="core" />
        <button class="btn btn-outline-dark btn-sm" type="submit"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" style="display: inline; position: relative; top: -2px;" fill="currentColor" class="bi bi-filetype-csv" viewBox="0 0 16 16">
            <path fill-rule="evenodd" d="M14 4.5V14a2 2 0 0 1-2 2h-1v-1h1a1 1 0 0 0 1-1V4.5h-2A1.5 1.5 0 0 1 9.5 3V1H4a1 1 0 0 0-1 1v9H2V2a2 2 0 0 1 2-2h5.5zM3.517 14.841a1.13 1.13 0 0 0 .401.823q.195.162.478.252.284.091.665.091.507 0 .859-.158.354-.158.539-.44.187-.284.187-.656 0-.336-.134-.56a1 1 0 0 0-.375-.357 2 2 0 0 0-.566-.21l-.621-.144a1 1 0 0 1-.404-.176.37.37 0 0 1-.144-.299q0-.234.185-.384.188-.152.512-.152.214 0 .37.068a.6.6 0 0 1 .246.181.56.56 0 0 1 .12.258h.75a1.1 1.1 0 0 0-.2-.566 1.2 1.2 0 0 0-.5-.41 1.8 1.8 0 0 0-.78-.152q-.439 0-.776.15-.337.149-.527.421-.19.273-.19.639 0 .302.122.524.124.223.352.367.228.143.539.213l.618.144q.31.073.463.193a.39.39 0 0 1 .152.326.5.5 0 0 1-.085.29.56.56 0 0 1-.255.193q-.167.07-.413.07-.175 0-.32-.04a.8.8 0 0 1-.248-.115.58.58 0 0 1-.255-.384zM.806 13.693q0-.373.102-.633a.87.87 0 0 1 .302-.399.8.8 0 0 1 .475-.137q.225 0 .398.097a.7.7 0 0 1 .272.26.85.85 0 0 1 .12.381h.765v-.072a1.33 1.33 0 0 0-.466-.964 1.4 1.4 0 0 0-.489-.272 1.8 1.8 0 0 0-.606-.097q-.534 0-.911.223-.375.222-.572.632-.195.41-.196.979v.498q0 .568.193.976.197.407.572.626.375.217.914.217.439 0 .785-.164t.55-.454a1.27 1.27 0 0 0 .226-.674v-.076h-.764a.8.8 0 0 1-.118.363.7.7 0 0 1-.272.25.9.9 0 0 1-.401.087.85.85 0 0 1-.478-.132.83.83 0 0 1-.299-.392 1.7 1.7 0 0 1-.102-.627zm8.239 2.238h-.953l-1.338-3.999h.917l.896 3.138h.038l.888-3.138h.879z"/>
          </svg></button>
    </form>
</div>
<br>
<script>
/*
A function that updates:
- the Presence/Absence Matrix content;
- the dropdown select list button text;
- the download matrix hidden get parameter (gene_class) value
based on the gene class chosen in the dropdown select list.
*/
function updateMatrix(gene_class, gene_class_text) {
    // Obtain the species name from the url: ----
    const urlParams = new URLSearchParams(window.location.search);
    const species = urlParams.get('species');

    // Update the iframe src property value: ----
    document.getElementById('heatmap_iframe').src = '{% url "hotmap" %}?species=' + species + '&gene_class=' + gene_class;

    // Update dropdown select list button text: ----
    document.getElementById('dropdownButton').textContent = gene_class_text;

    // Update the download form hidden element (gene_class) value: ----
    document.getElementById('form_gene_class').value = gene_class;
}
</script>
{% endblock %}
