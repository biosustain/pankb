{% extends "components/panel_universal.html" %}
{% load static %}
{% block panel_content %}
<table id="species_list" class="table table-hover" style="width: 100%;">
    <thead>
        <tr>
            <th class="text-left align-left">Species</th>
            <th class="text-left align-left" style="width: 30%;">Family</th>
        </tr>
    </thead>
    <tbody id="table-body-species">
        {% for row in species_results %}
        <tr>
            <td><a href="{% url 'pangenome_analyses_overview' %}?species={{ row.pangenome_analysis }}">{{ row.species }}</a></td>
            <td>{{ row.family }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

<script>
    $(document).ready(function () {
        // Initialize DataTable with drawCallback after the document is loaded
        $('#species_list').DataTable({
            searching: false,
            lengthChange: false,
            bPaginate: false,
            paging: false,
            bInfo: false,
            autoWidth: true,
            fixedColumns: true,
            scrollX: true,
            order: [],    // preserve the original order (needed to order by relevance)
        });
    });
</script>
{% endblock %}
