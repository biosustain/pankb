{% extends "components/panel_universal.html" %}
{% load static %}
{% block panel_content %}
<table id="families_list" class="table table-hover" style="table-layout: fixed;">
    <thead>
        <tr>
            <th class="text-left align-left">Family</th>
        </tr>
    </thead>
    <tbody id="table-body-families">
        {% for row in families_results %}
        <tr>
            <td><a href="{% url 'organisms' %}?family={{ row.family }}">{{ row.family }}</a></td>
        </tr>
        {% endfor %}
    </tbody>
</table>

<script>
    $(document).ready(function () {
        // Initialize DataTable with drawCallback after the document is loaded
        $('#families_list').DataTable({
            searching: false,
            lengthChange: false,
            bPaginate: false,
            paging: false,
            bInfo: false,
            order: [],     // preserve the original order (needed to order by relevance)
        });
    });
</script>
{% endblock %}
