{% extends "components/panel_universal.html" %}
{% load static %}
{% block panel_content %}
<table id="pathways_list" class="table table-hover" style="table-layout: fixed;">
    <thead>
        <tr>
            <th class="text-left align-left" style="width: 30%;">ID</th>
            <th class="text-left align-left">Name</th>
        </tr>
    </thead>
    <tbody id="table-body-pathways">
        {% for row in pathways_results %}
        <tr>
            <td><a href="{% url 'pathway_info' %}?pathway_id={{ row.pathway_id }}">{{ row.pathway_id }}</a></td>
            <td class="pathway_name">{{ row.pathway_name }}</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

<script>
    $(document).ready(function () {
        // Initialize DataTable with drawCallback after the document is loaded
        $('#pathways_list').DataTable({
            searching: false,
            lengthChange: false,
            bPaginate: false,
            paging: false,
            bInfo: false,
            order: [],     // preserve the original order (needed to order by relevance)
        });
    });
</script>
{% endblock %}
