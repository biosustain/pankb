{% load static %}
<!doctype html>
<html lang="en" data-bs-theme="auto">
  <head>
    <!-- Include tracking with Google Analytics -->
    {% include "google_tag.html" %}

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="">
    <meta name="author" content="NNF CfB: Reconstruction Team">
    <title>{% block page_title %}PanKB{% endblock %}</title>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <link href="{% static 'css/custom.css' %}" rel="stylesheet">
    <meta name="theme-color" content="#712cf9">
    <style>
        body {
            position: relative !important;
            padding-bottom: 2rem;
        }
        #search-examples-wrapper {
            transition: max-height 0.5s ease;
            max-height: 0rem;
            overflow: hidden;
        }
        #search-row:focus-within > #search-examples-wrapper {
            max-height: 10rem;
        }
        .navbar {
            padding-top: 0rem !important;
            padding-bottom: 0rem !important;
        }
        .navbar .nav-item {
            padding-top: 0.5rem !important;
            padding-bottom: 0.5rem !important;
            border-bottom: 2px var(--bs-dark) solid;
        }
        .navbar .nav-item:has(a.active) {
            border-bottom: 2px var(--bs-primary) solid !important;
        }
        .panel-col {
            transition: all 0.2s ease;
        }
        .responsive-iframe > iframe {
            width: 100%;
            aspect-ratio: 16 / 9;
        }
        .responsive-iframe-square > iframe {
            width: 100%;
            aspect-ratio: 1 / 1;
        }
        .responsive-iframe-full > iframe {
            width: 100%;
            height: calc(100vh - 200px);
            min-height: 400px;
        }
        .responsive-iframe-wide > iframe {
            width: 100%;
            aspect-ratio: 3 / 1;
        }
        .responsive-iframe-h30 > iframe {
            width: 100%;
            height: 30rem;
        }
        .logo-image {
            height: 5rem;
            margin-top: 1rem;
        }
    </style>
    <script>
        function toggle_classes(element_id, class1, class2) {
            var element = document.getElementById(element_id);
            element.classList.toggle(class1);
            element.classList.toggle(class2);
        }
    </script>
</head>
{% block base_content %}
{% endblock %}
</html>
