{% load static %}
<div class="sticky-top pt-2">
    <div class="card bg-infopanel">
        <div class="d-none d-md-block" style="height: 20px; margin-bottom: -20px; position: relative; top: 0; width: 100%;">
            <div class="float-end" style="width: 24px; height: 20px;"><a href="#" onclick="toggle_infopanel();"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="#cccdce" class="bi bi-arrow-left-square-fill" viewBox="0 0 16 16">
                <path d="M16 14a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V2a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2zm-4.5-6.5H5.707l2.147-2.146a.5.5 0 1 0-.708-.708l-3 3a.5.5 0 0 0 0 .708l3 3a.5.5 0 0 0 .708-.708L5.707 8.5H11.5a.5.5 0 0 0 0-1"/>
              </svg></a></div>
        </div>
        <div class="card-body">
            {% block info_panel_titles %}{% endblock %}
        </div>
        {% block info_panel_nav %}{% endblock %}
        <hr />
        <div class="card-body">
            {% block info_panel_content %}{% endblock %}
        </div>
        {% block info_panel_page_nav %}{% endblock %}
    </div>
</div>
{% block info_panel_modals %}{% endblock %}
