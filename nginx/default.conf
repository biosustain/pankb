upstream django {
        server django_gunicorn:8000;
}


server {
        listen 80;
        listen [::]:80;

        server_name pankb.org www.pankb.org;
        server_tokens off;

        location /.well-known/acme-challenge/ {
                root /var/www/certbot;
        }

        location /static/ {
                alias /static/;
        }

        location / {
                return 301 https://$server_name$request_uri;
        }
}
