upstream django {
        server django_gunicorn:8000;
}


server {
        listen 80;
        listen [::]:80;

        server_name pankb.org www.pankb.org;
        server_tokens off;

        location /.well-known/acme-challenge/ {
                root /var/www/certbot;
        }

        location /static/ {
                alias /static/;
        }

        location / {
                return 301 https://$server_name$request_uri;
        }
}


server {
        listen 443 default_server ssl http2;
        listen [::]:443 ssl http2;

        server_name pankb.org www.pankb.org;

        ssl_certificate /etc/nginx/ssl/live/pankb.org/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/live/pankb.org/privkey.pem;
        
        # MCP proxy for OAuth (with WebSocket support for Streamlit)
        location /copilot/ {
                proxy_pass http://10.0.0.15:8503;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                # WebSocket support
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_read_timeout 86400;
        }
        location /static/ {
                alias /static/;
        }

        location / {
                proxy_pass http://django;
                proxy_connect_timeout 300;
                proxy_send_timeout 300;
                proxy_read_timeout 300;
        }
}
